# The app with its database:
#
#   docker compose up -d --build
#
# The playground is then at http://<host>:3000 and the study at
# http://<host>:3000/es/study. The database keeps its data in the `mongo-data`
# volume across restarts and rebuilds. JWT_SECRET signs the accounts'
# sessions, and STUDY_KEY is the secret that reads the study's sessions back
# from http://<host>:3000/api/study?key=<STUDY_KEY>: put both in a .env file
# next to this file.
#
# To deploy the study on its own -- nothing else reachable, every other page
# sent to it -- under a path a reverse proxy hands to it, add to that .env:
#
#   STUDY_ONLY=1
#   BASE_PATH=/evaluacion-er
#
# and the study is at http://<host>:3000/evaluacion-er/es/study, the sessions
# at http://<host>:3000/evaluacion-er/api/study?key=<STUDY_KEY>. Both are baked
# in at build time, so changing them means `docker compose up -d --build`.
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_STUDY_ONLY: ${STUDY_ONLY:-}
        NEXT_PUBLIC_BASE_PATH: ${BASE_PATH:-}
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      JWT_SECRET: ${JWT_SECRET:-change-me}
      STUDY_KEY: ${STUDY_KEY:?set STUDY_KEY, the secret that reads the study's sessions back}
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
